name: Keepalive (heartbeat)

# Держит репозиторий «активным»: GitHub отключает scheduled-workflow после 60 дней без
# активности. Раз в неделю делаем крохотный коммит-heartbeat → таймер простоя сбрасывается,
# и часовой автосбор курсов/каталога (deploy.yml) продолжает работать.

on:
  schedule:
    - cron: "23 6 * * 1"     # каждый понедельник 06:23 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Commit heartbeat (пуш под PAT — иначе таймер простоя НЕ сбрасывается)
        env:
          PAT: ${{ secrets.GH_PAT }}
        run: |
          # ВАЖНО: пуш под персональным токеном (PAT), а НЕ под GITHUB_TOKEN. Коммиты/пуши бота
          # github-actions не считаются активностью репо → 60-дневный таймер авто-отключения
          # scheduled-workflow не сбрасывался бы. PAT-пуш = активность юзера → таймер сбрасывается.
          git config user.name "sementsul"
          git config user.email "45505876+sementsul@users.noreply.github.com"
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/heartbeat.txt
          git add .github/heartbeat.txt
          # [skip ci] — не запускать deploy из-за heartbeat
          git commit -m "chore: keepalive heartbeat [skip ci]" || { echo "нет изменений"; exit 0; }
          git push "https://x-access-token:${PAT}@github.com/sementsul/ratescout-es.git" HEAD:main
