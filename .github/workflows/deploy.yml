name: Build & Deploy RateScout

# 🔴 Ключ BestChange живёт ТОЛЬКО в GitHub Secrets и используется здесь, в раннере.
# В опубликованный сайт (dist/) попадают лишь курсы — ключа там нет.
# Настрой секреты: Settings → Secrets and variables → Actions:
#   BESTCHANGE_API_KEY   — партнёрский ключ
#   BESTCHANGE_RATES_URL — URL экспорта курсов с плейсхолдером {key} (из доков bestchange.app)

on:
  schedule:
    - cron: "17 * * * *"      # каждый час — свежие курсы
    - cron: "47 * * * *"      # дубль в час: GitHub часто пропускает schedule — больше шансов
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write        # для коммита history.json обратно в репозиторий
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build deps (markdown для блога, Pillow + шрифт DejaVu для обложек статей)
        run: |
          pip install --quiet markdown Pillow
          sudo apt-get install -y --no-install-recommends fonts-dejavu-core || echo "шрифт уже есть/пропущен"

      - name: Fetch rates (key from Secret — NOT committed, NOT in output)
        env:
          BESTCHANGE_API_KEY: ${{ secrets.BESTCHANGE_API_KEY }}
          BESTCHANGE_RATES_URL: ${{ secrets.BESTCHANGE_RATES_URL }}
        # необязательно: пока секреты не заданы — сайт публикуется без цифр курсов
        run: python3 fetch_rates.py || echo "⚠️ курсы пропущены (секреты не заданы) — собираю без них"

      - name: Update rate history (daily snapshot → history.json)
        run: python3 history.py || echo "⚠️ история пропущена"

      - name: Fetch market data (CoinGecko, free, no key) → market.json
        env:
          COINGECKO_KEY: ${{ secrets.COINGECKO_KEY }}
        run: python3 fetch_market.py || echo "⚠️ рыночные данные пропущены — собираю без них"

      - name: Fetch trending (CoinGecko /search/trending, free) → trending.json
        env:
          COINGECKO_KEY: ${{ secrets.COINGECKO_KEY }}
        run: python3 fetch_trending.py || echo "⚠️ тренды пропущены — собираю без них"

      - name: Fetch Yandex search queries (Webmaster API) → yandex.json
        env:
          YANDEX_OAUTH_TOKEN: ${{ secrets.YANDEX_OAUTH_TOKEN }}
          YANDEX_HOST: ${{ secrets.YANDEX_HOST }}
        run: python3 fetch_yandex_queries.py || echo "⚠️ Яндекс-запросы пропущены — собираю без них"

      - name: Fetch Yandex Metrika search phrases → metrika.json
        env:
          YANDEX_OAUTH_TOKEN: ${{ secrets.YANDEX_OAUTH_TOKEN }}
          YANDEX_METRIKA_COUNTER: ${{ secrets.YANDEX_METRIKA_COUNTER }}
        run: python3 fetch_metrika.py || echo "⚠️ Метрика-фразы пропущены — собираю без них"

      - name: Fetch OFAC sanctions list → aml-sanctions.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}     # аутентиф. доступ к GitHub API (без 429 на raw)
        run: python3 fetch_aml.py || echo "⚠️ санкционный список пропущен — AML-чек без него"

      - name: Fetch Fear & Greed index (free) → fng.json
        run: python3 fetch_fng.py || echo "⚠️ индекс страха пропущен"

      - name: Build static site
        env:
          GSC_VERIFICATION: ${{ secrets.GSC_VERIFICATION }}
        run: python3 build.py

      - name: Persist rate history back to repo (once/day, skip ci)
        run: |
          if ! git diff --quiet -- history.json aml-sanctions.json; then
            git config user.name "ratescout-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add history.json aml-sanctions.json
            git commit -m "chore(data): снимок курсов + санкционный список OFAC [skip ci]"
            git push
            echo "✅ history.json/aml-sanctions.json обновлены и запушены"
          else
            echo "история без изменений — коммит не нужен"
          fi

      - name: Guard — ключ НЕ должен попасть в сборку
        run: |
          if [ -n "$BESTCHANGE_API_KEY" ] && grep -rqF "$BESTCHANGE_API_KEY" dist/ ; then
            echo "🔴 КЛЮЧ ОБНАРУЖЕН В dist/ — прерываю деплой"; exit 1
          fi
          echo "✅ ключа в dist/ нет"
        env:
          BESTCHANGE_API_KEY: ${{ secrets.BESTCHANGE_API_KEY }}

      - name: Smoke-verify built site (отменяет деплой, если сборка логически битая)
        run: python3 verify_build.py

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - id: deploy
        uses: actions/deploy-pages@v5

      # Пинг IndexNow только при реальных изменениях контента (push/ручной запуск), НЕ на почасовом cron
      # и НЕ на бот-коммитах history.json (иначе весь sitemap спамится каждый час → троттлинг).
      - name: Check content changes for IndexNow
        id: indexnow_gate
        run: |
          if git diff HEAD~1 --name-only 2>/dev/null | grep -qE '^(build\.py|articles/|book/|data\.json|currencies\.json|glossary\.json|blogger_daily\.py)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Ping IndexNow (Яндекс/Bing)
        if: github.event_name != 'schedule' && steps.indexnow_gate.outputs.changed == 'true'
        run: python3 indexnow.py || echo "IndexNow пропущен"
